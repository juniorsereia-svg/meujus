<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeuJus — Banco de Provas</title>
  <meta name="description" content="Provas pré-montadas. Escolha disciplina, tema e a prova.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    .questao{padding-top:.75rem}
    .meta{font-size:.78rem;color:#6b7280;margin-top:.25rem}
    .enunciado{color:#000;font-weight:400;text-align:justify;font-size:0.9rem;line-height:1.5;margin-top:.45rem;white-space:pre-line;background:#f0f0f0;padding:.6rem .75rem;border-radius:.75rem}
    .alternativas{margin-left:1rem;margin-top:.35rem}
    .alternativas li{cursor:pointer;user-select:none;font-size:0.8rem;line-height:1.5}
    .alternativas li[aria-disabled="true"]{cursor:default}
    .separador{border-bottom:1px solid #e5e7eb;margin:16px 0}
    .combo{position:relative}
    .combo--solid .combo-control{display:flex;align-items:center;gap:.4rem;border:1px solid #e5e7eb;border-radius:14px;padding:.45rem .65rem;background:#fff}
    .combo-input{width:100%;border:0;outline:0;font-size:0.9rem;line-height:1.4;padding:.1rem}
    .combo-caret,.combo-close{font-size:.9rem;line-height:1;padding:.25rem .5rem;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer}
    .combo-close{padding:.25rem .45rem}
    .combo-caret:hover,.combo-close:hover{background:#f8fafc}
    .combo-panel{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e5e7eb;border-radius:14px;max-height:260px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .combo-item{position:relative;padding:10px 12px 10px 36px;font-size:.9rem;line-height:1.3;cursor:pointer;user-select:none}
    .combo-item:hover{background:#f8fafc}
    .divider{height:1px;background:linear-gradient(90deg,#fff,#e5e7eb 10%,#e5e7eb 90%,#fff);margin:1rem 0}
    .acoes-ia{margin-top:.6rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .btn-ia{width:26px;height:26px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #fff;color:#2563eb;cursor:pointer;transition:transform .06s ease,background-color .12s ease,border-color .12s ease;text-decoration:none;font-size:.85rem;font-weight:600}
    .btn-ia:hover{background:#f8fafc;border-color:#6b7280;transform:translateY(-1px)}
    .btn-ia:focus{outline:2px solid #93c5fd;outline-offset:2px}
    .btn-substituir{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9999px;border:1px solid #fff;background:#fff;color:#2563eb;font-size:.9rem;line-height:1;cursor:pointer;transition:transform .06s ease,background-color .12s ease,border-color .12s ease}
    .btn-substituir:hover{background:#f8fafc;border-color:#6b7280;transform:translateY(-1px)}
    @media (max-width:640px){.enunciado{font-size:1rem;line-height:1.6}.alternativas li{font-size:.9rem;line-height:1.6}}
    @media print {
      @page { size: A4; margin: 10mm; }
      header, footer, .no-print, #screenArea { display:none !important; }
      #printArea { display:block !important; }
      #printArea{column-count:2;column-gap:10mm;column-fill:auto;column-rule:0.1mm solid #cbd5e1;margin:0;padding:0}
      .meta{display:block !important;color:#6b7280 !important;font-size:.72rem !important;margin-top:.15rem}
      .enunciado{font-size:0.90rem !important;line-height:1.5;color:#111827 !important;text-align:justify;hyphens:auto;-webkit-hyphens:auto;break-after:avoid-column;background:transparent !important;padding:0 !important;border-radius:0 !important}
      .alternativas li{font-size:0.8rem !important;line-height:1.5;break-inside:avoid}
      .acoes-ia,.btn-substituir{display:none !important}
      .questao{break-inside:auto;page-break-inside:auto}
      .separador{margin:6px 0;border-bottom:1px solid #d1d5db}
      #printArea *{box-shadow:none !important}
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-zinc-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a class="flex items-center gap-3" href="#"><span class="text-lg font-semibold">MeuJus</span></a>
      <div class="text-sm text-zinc-500">© <span id="ano"></span></div>
    </div>
  </header>

  <section id="screenArea" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h2 class="text-xl font-semibold">Escolher prova</h2>
          <form id="formProva" class="mt-4 grid gap-4" autocomplete="off">
            <label class="grid gap-2">
              <span class="text-sm font-medium">Disciplina</span>
              <div class="combo combo--solid" id="cursoCombo">
                <div class="combo-control">
                  <input id="cursoInput" class="combo-input" placeholder="Selecione ou digite para buscar…"/>
                  <button type="button" class="combo-caret" aria-label="Abrir">▾</button>
                  <button type="button" class="combo-close" aria-label="Fechar">×</button>
                </div>
                <div id="cursoPanel" class="combo-panel hidden"></div>
              </div>
              <input id="cursoHidden" type="hidden"/>
            </label>

            <div class="divider"></div>

            <label class="grid gap-2">
              <span class="text-sm font-medium">Tema</span>
              <div class="combo combo--solid">
                <div class="combo-control">
                  <input id="temaInput" class="combo-input" placeholder="Selecione um tema…"/>
                  <button type="button" class="combo-caret" aria-label="Abrir">▾</button>
                  <button type="button" class="combo-close" aria-label="Fechar">×</button>
                </div>
                <div id="temaPanel" class="combo-panel hidden"></div>
              </div>
              <input id="temasHidden" type="hidden"/>
            </label>

            <label class="grid gap-2">
              <span class="text-sm font-medium">Prova</span>
              <select id="provaSel" class="rounded-2xl border border-zinc-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-black/10">
                <option value="0">Aleatória (1–10)</option>
                <option value="1">Prova 1</option><option value="2">Prova 2</option>
                <option value="3">Prova 3</option><option value="4">Prova 4</option>
                <option value="5">Prova 5</option><option value="6">Prova 6</option>
                <option value="7">Prova 7</option><option value="8">Prova 8</option>
                <option value="9">Prova 9</option><option value="10">Prova 10</option>
              </select>
            </label>

            <div class="mt-2 flex gap-3">
              <button type="submit" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 bg-black text-white hover:bg-zinc-800">Gerar</button>
              <button type="button" id="btnLimpar" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Limpar</button>
              <button type="button" id="btnImprimir" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Imprimir</button>
            </div>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h3 class="text-lg font-semibold">Prova</h3>
          <div id="previewVazio" class="mt-6 rounded-2xl border border-dashed border-zinc-300 p-10 text-center text-sm text-zinc-600">
            Nenhuma prova gerada.
          </div>
          <div id="previewConteudo" class="mt-6 hidden">
            <article id="artigo" class="max-w-none"></article>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main id="printArea" class="px-4 pb-4"><article id="printArticle"></article></main>

  <footer class="border-t border-zinc-200 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-sm text-zinc-500">
      <div class="flex items-center justify-between">
        <p>MeuJus — Banco de Provas</p>
        <p id="rodapeAno"></p>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
  <script>
    // registra SW com escopo da pasta atual (compatível com subcaminho do GitHub Pages)
    if('serviceWorker' in navigator){
      const base = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]+$/,'');
      navigator.serviceWorker.register(base + 'sw.js');
    }
  </script>
</body>
</html>
