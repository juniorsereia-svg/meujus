<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MeuJus — Gerador de Provas</title>
  <meta name="description" content="Gerador de provas de Direito — selecione disciplina, temas e gere uma prova objetiva para estudar." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">MeuJus</h1>
      <nav aria-label="principal">
        <span id="disciplina-container"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-labelledby="config-title">
      <h2 id="config-title">Configurar prova</h2>

      <div class="row">
        <label for="select-disciplina">Disciplina</label>
        <select id="select-disciplina" aria-label="Selecionar disciplina"></select>
      </div>

      <div id="temas-container" class="row">
        <p><strong>Temas</strong> (selecione um ou mais)</p>
        <div id="temas-list" class="temas-list" aria-live="polite"></div>
      </div>

      <div class="row">
        <label for="qtd">Quantidade de questões</label>
        <select id="qtd">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
      </div>

      <div class="row actions-row">
        <button id="btn-gerar" class="btn">Criar prova</button>
        <button id="btn-limpar" class="btn ghost">Limpar</button>
        <button id="btn-imprimir" class="btn ghost">Visualizar para impressão</button>
      </div>
    </section>

    <section id="prova-area" class="prova-area" aria-live="polite">
      <div id="info-area" class="info-area hidden">
        <span id="timer">Tempo: 00:00</span>
        <button id="btn-corrigir" class="btn">Corrigir</button>
      </div>

      <form id="prova-form" class="prova-form" onsubmit="return false;">
        <div id="questoes-list"></div>
      </form>

      <div id="resultado" class="resultado hidden" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2025 MeuJus — Gerador de Provas</small>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
