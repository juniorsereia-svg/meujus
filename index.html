<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeuJus — Gerador de Provas de Direito</title>
  <meta name="description" content="Gere provas a partir de um banco local de questões.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}

    /* Tipos e respiros da questão */
    .questao{padding-top:.75rem}
    .titulo-questao{font-size:0.95rem;font-weight:600;color:#1a335a}
    .meta{font-size:.78rem;color:#6b7280;margin-top:.25rem}
/* site: fundo cinza claro no enunciado */
.enunciado{
  color:#1a335a; font-weight:400; text-align:justify;
  font-size:0.9rem; line-height:1.5; margin-top:.45rem; white-space:pre-line;
  background:#f8fafc;            /* cinza clarinho */
  padding:.6rem .75rem;           /* respiro interno */
  border-radius:.75rem;           /* cantos suaves */
}
    .alternativas{margin-left:1rem;margin-top:.35rem}
    .alternativas li{cursor:pointer;user-select:none;font-size:0.8rem;line-height:1.5}
    .alternativas li[aria-disabled="true"]{cursor:default}
    .separador{border-bottom:1px solid #e5e7eb;margin:16px 0}

    /* Ênfase leve para **negrito** e *itálico* (usado com mdInline no app.js) */
    .enunciado .md-strong, .alternativas .md-strong, .meta .md-strong{font-weight:600}
    .enunciado .md-em,     .alternativas .md-em,     .meta .md-em{font-style:italic}

    /* Combos custom (curso, temas, subtemas) */
    .combo{position:relative}
    .combo--solid .combo-control{
      display:flex; align-items:center; gap:.4rem;
      border:1px solid #e5e7eb; border-radius:14px; padding:.45rem .65rem; background:#fff;
    }
    .combo-input{width:100%; border:0; outline:0; font-size:0.9rem; line-height:1.4; padding:.1rem}
    .combo-caret,.combo-close{
      font-size:.9rem; line-height:1; padding:.25rem .5rem; border:1px solid #e5e7eb;
      border-radius:8px; background:#fff; cursor:pointer;
    }
    .combo-close{padding:.25rem .45rem}
    .combo-caret:hover,.combo-close:hover{background:#f8fafc}
    .combo-panel{
      position:absolute; z-index:20; left:0; right:0; top:calc(100% + 6px);
      background:#fff; border:1px solid #e5e7eb; border-radius:14px; max-height:260px; overflow:auto;
      box-shadow:0 10px 30px rgba(0,0,0,.06)
    }
    .combo-item{padding:8px 12px; font-size:.9rem; cursor:pointer}
    .combo-item:hover{background:#f8fafc}
    .combo-item[aria-selected="true"]{background:#eef2ff}
    .divider{height:1px; background:linear-gradient(90deg,#fff,#e5e7eb 10%,#e5e7eb 90%,#fff); margin:1rem 0}
    #chips .chip{font-size:.78rem; padding:2px 8px}
    #chipsSub .chip{font-size:.7rem; padding:1px 6px}

    #printArea{ display:none; }

   /* IA: rótulo + 4 botões redondos (mesmo tamanho do botão substituir) */
.acoes-ia{margin-top:.6rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.ia-label{font-size:.8rem; color:#2563eb}

.btn-ia{
  width:26px; height:26px; border-radius:9999px;
  display:inline-flex; align-items:center; justify-content:center;
  background:#fff; border:1px solid #fff; color:#2563eb;
  cursor:pointer; transition:transform .06s ease, background-color .12s ease, border-color .12s ease;
}
.btn-ia:hover{ background:#f8fafc; border-color:#6b7280; transform:translateY(-1px); }
.btn-ia:focus{ outline:2px solid #93c5fd; outline-offset:2px; }
.btn-ia:disabled{ opacity:.5; cursor:default; }
.btn-ia svg{ width:18px; height:18px; color:#2563eb; } /* ícone maior */

.btn-substituir{
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:9999px;
  border:1px solid #fff; background:#fff; color:#2563eb;
  font-size:.9rem; line-height:1; cursor:pointer;
  transition:transform .06s ease, background-color .12s ease, border-color .12s ease;
}
.btn-substituir:hover{ background:#f8fafc; border-color:#6b7280; transform:translateY(-1px); }
.btn-substituir:focus{ outline:2px solid #93c5fd; outline-offset:2px; }
.btn-substituir svg{ width:22px; height:22px; color:#2563eb; } /* ícone maior */




    /* PRINT */
    @media print {
      @page { size: A4; margin: 10mm; }
      header, footer, .no-print, #screenArea { display:none !important }
      #printArea { display:block !important }
      #printArea{ column-count:2; column-gap:10mm; column-fill:auto; column-rule:0.1mm solid #cbd5e1; margin:0; padding:0; }
      .titulo-questao{font-size:0.80rem !important;font-weight:600;color:#111827 !important}
      .meta{ display:block !important; color:#6b7280 !important; font-size:.72rem !important; margin-top:.15rem }
@media print{
  .enunciado{
    font-size:0.90rem !important; line-height:1.5; color:#111827 !important; text-align:justify;
    hyphens:auto; -webkit-hyphens:auto; break-after:avoid-column;
    background:transparent !important;  /* sem fundo na impressão */
    padding:0 !important;               /* remove padding no papel */
    border-radius:0 !important;
  }
}
      .alternativas li{font-size:0.8rem !important; line-height:1.5; break-inside:avoid}
      .acoes-ia,.btn-substituir{ display:none !important; }
      .questao{ break-inside:auto; page-break-inside:auto; }
      .separador{ margin:6px 0; border-bottom:1px solid #d1d5db }
      #printArea *{ box-shadow:none !important }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-zinc-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a class="flex items-center gap-3" href="#">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="10" fill="#111827"/>
          <path d="M14 30c6 0 8-8 10-8s4 8 10 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="18" r="3" fill="white"/>
        </svg>
        <span class="text-lg font-semibold">MeuJus</span>
      </a>
      <div class="text-sm text-zinc-500">© <span id="ano"></span></div>
    </div>
  </header>

  <section id="screenArea" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h2 class="text-xl font-semibold">Gerar prova</h2>
          <form id="formProva" class="mt-4 grid gap-4" autocomplete="off">
            <!-- Curso -->
            <label class="grid gap-2">
              <span class="text-sm font-medium">Curso</span>
              <div class="combo combo--solid" id="cursoCombo">
                <div class="combo-control">
                  <input id="cursoInput" class="combo-input" placeholder="Selecione ou digite para buscar…"/>
                  <button type="button" class="combo-caret" aria-label="Abrir">▾</button>
                  <button type="button" class="combo-close" aria-label="Fechar">×</button>
                </div>
                <div id="cursoPanel" class="combo-panel hidden"></div>
              </div>
              <input id="cursoHidden" type="hidden"/>
            </label>

            <div class="divider"></div>

            <!-- Temas -->
            <div class="grid gap-2">
              <span class="text-sm font-medium">Temas</span>
              <div class="combo combo--solid">
                <div id="chips" class="flex flex-wrap gap-2 mb-2"></div>
                <div class="combo-control">
                  <input id="temaInput" class="combo-input" placeholder="Digite para buscar e selecione…"/>
                  <button type="button" class="combo-caret" aria-label="Abrir">▾</button>
                  <button type="button" class="combo-close" aria-label="Fechar">×</button>
                </div>
                <div id="temaPanel" class="combo-panel hidden"></div>
              </div>
              <input id="temasHidden" type="hidden"/>
            </div>

            <!-- Subtemas -->
            <div class="grid gap-2">
              <span class="text-sm font-medium">Subtemas</span>
              <div class="combo combo--solid">
                <div id="chipsSub" class="flex flex-wrap gap-1 mb-2"></div>
                <div class="combo-control">
                  <input id="subtemaInput" class="combo-input" placeholder="Filtre e selecione subtemas…"/>
                  <button type="button" class="combo-caret" aria-label="Abrir">▾</button>
                  <button type="button" class="combo-close" aria-label="Fechar">×</button>
                </div>
                <div id="subtemaPanel" class="combo-panel hidden"></div>
              </div>
              <input id="subtemasHidden" type="hidden"/>
            </div>

            <label class="grid gap-2">
              <span class="text-sm font-medium">Nº Questões</span>
              <input id="inpQtd" type="number" min="1" max="100" value="10" class="rounded-2xl border border-zinc-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-black/10">
            </label>

            <div class="mt-2 flex gap-3">
              <button type="submit" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 bg-black text-white hover:bg-zinc-800">Gerar</button>
              <button type="button" id="btnLimpar" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Limpar</button>
              <button type="button" id="btnImprimir" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Imprimir</button>
            </div>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h3 class="text-lg font-semibold">Prova</h3>
          <div id="previewVazio" class="mt-6 rounded-2xl border border-dashed border-zinc-300 p-10 text-center text-sm text-zinc-600">
            Nenhuma prova gerada.
          </div>
          <div id="previewConteudo" class="mt-6 hidden">
            <article id="artigo" class="max-w-none"></article>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main id="printArea" class="px-4 pb-4">
    <article id="printArticle"></article>
  </main>

  <footer class="border-t border-zinc-200 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-sm text-zinc-500">
      <div class="flex items-center justify-between">
        <p>MeuJus — Gerador de Provas</p>
        <p id="rodapeAno"></p>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
