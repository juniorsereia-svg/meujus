<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeuJus — Gerador de Provas de Direito</title>
  <meta name="description" content="Gere provas a partir de um banco local de questões.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}

    /* Tipos - 2px menores que antes */
    .enunciado{color:#1a335a;font-weight:400;text-align:justify;font-size:0.95rem;line-height:1.55}
    .alternativas{margin-left:1rem}
    .alternativas li{cursor:pointer;user-select:none;font-size:0.875rem;line-height:1.5}
    .alternativas li[aria-disabled="true"]{cursor:default}
    .meta{font-size:.75rem;color:#6b7280}
    .separador{border-bottom:1px solid #e5e7eb;margin:14px 0}

    /* Dropdown Temas */
    .combo{position:relative}
    .combo-input{width:100%}
    .combo-panel{position:absolute;z-index:20;left:0;right:0;top:100%;background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-top:6px;max-height:220px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .combo-item{padding:8px 12px;font-size:.9rem}
    .combo-item[aria-selected="true"]{background:#f3f4f6}
    .chip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;font-size:.8rem;border-radius:9999px;padding:2px 8px}

    /* Reduz o tamanho do seletor de temas (input, lista e chips) */
    #screenArea .combo-input{font-size:0.85rem;padding:8px 12px}
    #screenArea .combo-panel .combo-item{font-size:0.82rem;padding:6px 10px}
    #screenArea #chips .chip{font-size:0.75rem;padding:2px 6px}
    #screenArea .combo-input::placeholder{font-size:0.85rem;color:#9ca3af}

    #printArea{ display:none; }

    /* PRINT: 2 colunas, margens q0mm, gap 10mm, sem meta */
    @media print {
      @page { size: A4; margin: 10mm; }
      html, body { background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact }

      header, footer, .no-print, #screenArea { display:none !important }
      #printArea { display:block !important }

      #printArea{
        column-count:2; column-gap:10mm; column-fill:balance;
        column-rule:0.1mm solid #cbd5e1; margin:0; padding:0
      }

      .enunciado{
  font-size: 0.90rem !important;
  line-height: 1.5;
  color: #111827 !important;
  text-align: justify;
  hyphens: auto;
  -webkit-hyphens: auto;
  break-after: avoid-column; /* evita enunciado “solto” no fim da coluna */
  orphans: 2;
  widows: 2;
}
.alternativas li{
  font-size: 0.825rem !important;
  line-height: 1.45;
  break-inside: avoid;
}
.meta{ display: none !important; }
.questao{
  break-inside: auto;
  page-break-inside: auto;
}

      .separador{margin:6px 0; border-bottom:1px solid #d1d5db}
      #printArea *{box-shadow:none !important}
    }
  </style>
</head>

<body class="bg-zinc-50 text-zinc-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-zinc-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a class="flex items-center gap-3" href="#">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="10" fill="#111827"/>
          <path d="M14 30c6 0 8-8 10-8s4 8 10 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="18" r="3" fill="white"/>
        </svg>
        <span class="text-lg font-semibold">MeuJus</span>
      </a>
      <div class="text-sm text-zinc-500">© <span id="ano"></span></div>
    </div>
  </header>

  <!-- Área de tela -->
  <section id="screenArea" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h2 class="text-xl font-semibold">Gerar prova</h2>
          <form id="formProva" class="mt-4 grid gap-4" autocomplete="off">
            <label class="grid gap-2">
              <span class="text-sm font-medium">Curso</span>
              <select id="selCurso" class="rounded-2xl border border-zinc-300 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-black/10"></select>
            </label>

            <div class="grid gap-2">
              <span class="text-sm font-medium">Temas</span>
              <div class="combo">
                <div id="chips" class="flex flex-wrap gap-2 mb-2"></div>
                <input id="temaInput" class="combo-input rounded-2xl border border-zinc-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-black/10" placeholder="Digite para buscar e selecione…" />
                <div id="temaPanel" class="combo-panel hidden"></div>
              </div>
              <input id="temasHidden" type="hidden" />
            </div>

            <label class="grid gap-2">
              <span class="text-sm font-medium">Nº Questões</span>
              <input id="inpQtd" type="number" min="1" max="100" value="10" class="rounded-2xl border border-zinc-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-black/10">
            </label>

            <div class="mt-2 flex gap-3">
              <button type="submit" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 bg-black text-white hover:bg-zinc-800">Gerar</button>
              <button type="button" id="btnLimpar" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Limpar</button>
              <button type="button" id="btnImprimir" class="inline-flex items-center gap-2 rounded-2xl px-4 py-2 border border-zinc-200 hover:bg-white">Imprimir</button>
            </div>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="rounded-3xl border border-zinc-200 bg-white p-6 shadow-sm">
          <h3 class="text-lg font-semibold">Prova</h3>
          <div id="previewVazio" class="mt-6 rounded-2xl border border-dashed border-zinc-300 p-10 text-center text-sm text-zinc-600">
            Nenhuma prova gerada.
          </div>
          <div id="previewConteudo" class="mt-6 hidden">
            <article id="artigo" class="max-w-none"></article>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Área exclusiva de impressão -->
  <main id="printArea" class="px-4 pb-4">
    <article id="printArticle"></article>
  </main>

  <footer class="border-t border-zinc-200 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-sm text-zinc-500">
      <div class="flex items-center justify-between">
        <p>MeuJus — Gerador de Provas</p>
        <p id="rodapeAno"></p>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
